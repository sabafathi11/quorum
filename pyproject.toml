[project]
name = "quorum"
version = "0.1.0"
description = "A bare multi-view annotation core. Everything you can see is a plugin."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "numpy>=1.24"]

[project.scripts]
quorum = "quorum.__main__:main"

[tool.setuptools.packages.find]
include = ["quorum*"]
